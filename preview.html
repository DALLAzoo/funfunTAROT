<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>카드 위 디오라마 v2 — 자연스러운 움직임 미리보기</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101918;color:#e5eee8;font-family:Arial,'Noto Sans KR',sans-serif}.tarot-app{min-height:100vh;display:flex;flex-direction:column;max-width:1100px;margin:auto;padding:clamp(15px,3vw,30px)}.intro{text-align:center;margin:clamp(18px,4vh,40px) 0 0}.intro h1{font:normal clamp(23px,4.5vw,42px) Georgia,serif;margin:12px 0}.intro p{color:#b3cabd;font-size:13px}.stage{position:relative;flex:1;min-height:430px;max-height:650px;perspective:1000px;overflow:hidden;isolation:isolate;background:#140d0d url('./assets/stage/velvet-studio-source.png') center/cover no-repeat}.cards{position:absolute;inset:0;transform-style:preserve-3d;z-index:1}.tarot-card{position:absolute;left:50%;top:50%;height:360px;width:210px;padding:0;border:0;transform-style:preserve-3d;cursor:pointer;touch-action:pan-y;background:transparent}.card-inner{display:block;width:100%;height:100%;position:relative;transform-style:preserve-3d}.card-face{position:absolute;inset:0;border-radius:8px;background:#191f1c;overflow:hidden;box-shadow:0 9px 24px #000a}.card-back{background:
url('https://dallazoo.github.io/funfunTAROT/assets/card-backs/back-01.webp') center/cover no-repeat,
radial-gradient(circle at 50% 45%, transparent 0 21%,#b4955e 21.2% 21.9%,transparent 22% 32%,#b4955e 32.3% 33%,transparent 33.2%),
repeating-conic-gradient(from 22deg at 50% 50%,#c1a776 0 3deg,transparent 3deg 15deg),
linear-gradient(147deg,#152820,#091412 60%,#1b3027);border:8px double #bd9859;}
.card-inner:after{content:'';position:absolute;inset:2%;border:1px solid #d4ad70a0;border-radius:6px;pointer-events:none}.tarot-card.is-picked .card-back{box-shadow:inset 0 0 0 2px #e9bd61,0 0 12px rgba(247,199,100,.8),0 0 23px rgba(207,147,47,.4)!important}.controls{text-align:center;padding:10px}.controls .actions{display:flex;justify-content:center;gap:12px;margin-top:10px}.primary,.secondary{background:#315b47;color:#eaf4e8;border:1px solid #93c9a6;border-radius:10px;padding:12px 22px;cursor:pointer}.secondary{background:#192b23}.status{font-size:12px;color:#bddac8;text-align:center}.stage.is-dragging{cursor:grabbing}@media(max-width:600px){.stage{min-height:380px;max-height:500px}.tarot-card{width:146px;height:250px}.intro h1{font-size:26px}}#stage .cardworld-canvas{position:absolute;inset:0;width:100%;height:100%;z-index:9;pointer-events:none;opacity:0;transition:opacity .6s}#stage .cardworld-canvas.is-active{opacity:1}
</style></head><body>
<main class="tarot-app" id="tarotApp"><section class="intro"><p>A MOMENT BETWEEN</p><h1>마음이 끌리는 카드를 선택하세요</h1><p>카드 위 작은 세계: 꽃·나무·옹달샘·사슴·토끼·하늘</p></section>
<section class="stage selection-stage" id="stage" aria-label="타로 카드 애니메이션"><div class="cards" id="cards"></div></section><section class="controls"><div class="status" id="state">한 번 누르면 선택 · 드래그하면 이동</div><div class="actions"><button class="primary" id="replay">다시 피어나기</button><button class="secondary" id="reveal">선택 카드 공개 장면</button></div></section></main>
<script>
let index=10,selected=null;const host=document.querySelector('#cards'),stage=document.querySelector('#stage');const cards=[];
for(let i=0;i<22;i++){const el=document.createElement('button');el.className='tarot-card';el.type='button';el.innerHTML='<span class="card-inner"><span class="card-face card-back"></span></span>';el.setAttribute('aria-label',(i+1)+'번 카드');el.addEventListener('click',()=>{if(document.querySelector('#stage').classList.contains('selection-stage')){selected=i;layout();}});host.append(el);cards.push(el);}
let sx=null;
stage.addEventListener('pointerdown',e=>{sx=e.clientX;});stage.addEventListener('pointerup',e=>{if(sx===null)return;const dx=e.clientX-sx;sx=null;if(Math.abs(dx)>32){index=(index+(dx<0?1:-1)+cards.length)%cards.length;selected=null;layout();}});
function layout(){const mobile=matchMedia('(max-width:600px)').matches;cards.forEach((el,i)=>{let off=((i-index+cards.length)%cards.length);if(off>cards.length/2)off-=cards.length;const on=Math.abs(off)<=3;el.hidden=!on;el.classList.toggle('selectable',on);el.classList.toggle('is-center',off===0);el.classList.toggle('is-picked',selected===i);if(!on)return;const gap=mobile?52:120,x=off*gap,y=Math.abs(off)*(mobile?22:28),rz=off*9,z=110-Math.abs(off)*45;el.style.transform=`translate(-50%,-50%) translate3d(${x}px,${y}px,${z}px) rotateZ(${rz}deg)`;el.style.zIndex=String(100-Math.abs(off)*9);});}
layout();window.addEventListener('resize',layout);
document.querySelector('#replay').onclick=()=>{stage.classList.remove('selection-stage');setTimeout(()=>{stage.classList.add('selection-stage');layout()},150)};
document.querySelector('#reveal').onclick=()=>{stage.classList.remove('selection-stage');document.querySelector('#state').textContent='디오라마가 사라진 뒤 기존 카드 공개 기능에 제어권을 넘깁니다.';setTimeout(()=>{stage.classList.add('selection-stage');layout()},2200)};
</script><script src="./js/effects/popup-diorama.js"></script></body></html>
