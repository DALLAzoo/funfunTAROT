<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101b19"><title>In-between Shift | 1장 타로</title><link rel="stylesheet" href="./css/tarot.css"></head><body><main class="tarot-app" id="tarotApp"><header class="top"><span>IN-BETWEEN SHIFT</span><span>1장 타로 · 독립 시험본</span></header><section class="intro"><p class="eyebrow">A MOMENT BETWEEN</p><h1>마음이 끌리는 카드를 선택하세요</h1><p id="instruction" aria-live="polite">카드를 섞을 때마다 새로운 무늬의 덱을 만납니다.</p></section><section class="stage" id="stage" aria-label="타로 카드 애니메이션"><div class="aura"></div><div class="cards" id="cards"></div></section><section class="controls"><div class="status"><span class="status-dot"></span><span id="status" role="status">준비 완료</span><span id="backName"></span></div><div id="navigation" class="navigation" hidden><button id="prevBtn" class="nav-btn" aria-label="이전 카드">←</button><span id="counter" aria-live="polite"></span><button id="nextBtn" class="nav-btn" aria-label="다음 카드">→</button><button id="selectBtn" class="secondary">가운데 카드 선택</button></div><div class="actions"><button id="shuffleBtn" class="primary">카드 섞기</button></div><p class="note" id="poolNotice"></p><p class="note" id="inventory"></p></section></main><section id="resultView" class="result-view" hidden><header class="top"><span>IN-BETWEEN SHIFT</span><span>YOUR CARD</span></header><h1 id="resultTitle" tabindex="-1">당신이 선택한 카드</h1><div id="resultCardHost" class="result-card-host"></div><h2 id="resultName"></h2><p id="resultNotice" class="note"></p><button id="resultAgain" class="primary">다시 섞기</button></section><script type="module" src="./js/main.js"></script></body></html>
