<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#061015">
<title>In-between Shift | 1장 타로</title>
<link rel="preload" href="assets/obsidian_stage.webp" as="image">
<link rel="stylesheet" href="studio.css">
</head>
<body>
<main class="shell" id="tarotApp">
 <section class="intro"><h1 id="resultSelectionTitle">마음이 끌리는 카드를 선택하세요</h1></section>
 <section class="theatre" id="stageWrap" aria-label="타로 카드 선택 공간">
  <div class="environment" aria-hidden="true"></div>
  <div class="ambient-light" aria-hidden="true"></div>
  <div class="light-shaft" aria-hidden="true"></div>
  <canvas id="view" aria-label="3D 타로 카드"></canvas>
  <div id="frontFallback" class="front-fallback" hidden><img id="frontFallbackImg" alt="선택한 카드 앞면"></div>
  <div id="fallbackDeck" class="fallback-deck" hidden></div>
  <div class="foreground" aria-hidden="true"></div>
  <div class="air" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>
  <div class="unavailable" id="unavailable" hidden>이 브라우저에서는 3D 화면을 표시할 수 없습니다.</div>
 </section>
 <section class="controls" id="controls">
  <button class="primary" id="shuffle" type="button">카드 섞기</button>
  <button class="secondary" id="resultAgain" type="button" hidden>다시 섞기</button>
  <div class="reading-choice"><button id="readingDropdown" class="reading-dropdown" type="button" aria-label="상담 종류" aria-expanded="false" aria-controls="readingOptions">조언 - 당신을 위한 <span aria-hidden="true">⌄</span></button><div class="reading-options" id="readingOptions" hidden><button type="button">조언 - 당신을 위한</button></div></div>
 </section>
 <section class="result-reading" id="resultView" hidden><p id="resultReading"></p></section>
 <!-- 이전 시험본이 사용하던 화면 문구는 모두 표시하지 않는다. -->
 <div hidden aria-hidden="true"><span id="sceneLabel"></span><span id="phaseText"></span><span id="phaseCount"></span><span id="state"></span><button type="button" id="sceneToggle"></button><input type="file" id="textureInput" accept="image/*"></div>
</main>
<script src="js/fallback.js"></script>
<script src="js/studio.js"></script>
</body>
</html>
