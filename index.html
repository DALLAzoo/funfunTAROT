<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101b19">
<title>In-between Shift | 1장 타로</title>





<link rel="stylesheet" href="./css/tarot.css">
<link rel="stylesheet" href="./css/effects/15-background-music.css"><script>const n=Math.floor(Math.random()*20);const id=n<8?'back-0'+(n+1):'back-1-'+(n-7);const src=n<8?'./assets/card-backs/'+id+'.webp':'./assets/card-backs/'+id+'.png';document.documentElement.dataset.initialBack=id;const l=document.createElement('link');l.rel='preload';l.as='image';l.href=src;document.head.append(l);</script><link rel="modulepreload" href="./js/screen/app/bootstrap.js"><link rel="modulepreload" href="./js/motion/animation/card-animation.js"><link rel="modulepreload" href="./js/settings/config/config.js"></head>
<body>
<main class="tarot-app" id="tarotApp">

<section class="intro" id="sharedIntro">
<p class="eyebrow">A MOMENT BETWEEN</p>
<h1 id="resultSelectionTitle">마음이 끌리는 카드를 선택하세요</h1>
<p id="instruction" aria-live="polite">카드를 섞을 때마다 새로운 무늬의 덱을 만납니다.</p>
</section>
<section class="stage" id="stage" aria-label="타로 카드 애니메이션">
<div class="aura">
</div>
<div class="cards" id="cards">
</div>
</section>
<section class="controls">
<div class="status">
<span class="status-dot">
</span>
<span id="status" role="status">준비 완료</span>
<span id="backName">
</span>
</div>
<div id="navigation" class="navigation" hidden>
<button id="prevBtn" class="nav-btn" aria-label="이전 카드">←</button>
<span id="counter" aria-live="polite">
</span>
<button id="nextBtn" class="nav-btn" aria-label="다음 카드">→</button>
<button id="selectBtn" class="secondary">가운데 카드 선택</button>
</div>
<div class="actions">
<button id="shuffleBtn" class="primary">카드 섞기</button>
<div class="reading-dropdown">
<button id="readingDropdown" type="button" class="reading-dropdown-trigger" aria-expanded="false" aria-controls="readingOptions">무엇이 궁금하세요? <span aria-hidden="true">⌄</span></button>
<div id="readingOptions" class="reading-dropdown-menu" hidden>
<button type="button" class="reading-option" aria-selected="true">조언 - 당신을 위한</button>
</div>

</div>
</div>
<p class="note" id="poolNotice">
</p>
<p class="note" id="inventory">
</p>
</section>
</main>
<section id="resultView" class="result-view" hidden>


<div id="resultCardHost" class="result-card-host">
</div>
<p id="resultReading" class="result-reading" aria-live="polite"></p>
<p id="resultNotice" class="note" hidden></p>
<div class="result-actions">
<button id="resultAgain" class="primary" hidden>다시 섞기</button>
</div>
</section>
<!-- v38: draggable floating music note; same single-track BGM. -->
<div class="ad1-bgm-control" aria-label="배경음 설정">
  <button id="bgmToggle" class="ad1-bgm-toggle" type="button" aria-pressed="false" aria-label="배경음 켜기" title="배경음 켜기">
    <span class="ad1-bgm-icon" aria-hidden="true">♫</span><span id="bgmLabel" class="ad1-bgm-label">음악 켜기</span>
  </button>
</div>
<audio id="bgmAudio" preload="none" loop playsinline aria-hidden="true">
  <source src="./assets/audio/bgm-deep-day-3.mp3" type="audio/mpeg">
</audio>
<script type="module" src="./js/effects/background-music.js"></script>
<script type="module" src="./js/screen/app/main.js">
</script>
</body>
</html>
