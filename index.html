<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101b19"><title>In-between Shift | 1장 타로</title><link rel="stylesheet" href="./css/tarot.css"></head><body><main class="tarot-app" id="tarotApp"><header class="top"><span>IN-BETWEEN SHIFT</span><span>1장 타로 · 독립 시험본</span></header><section class="intro"><p class="eyebrow">A MOMENT BETWEEN</p><h1>마음이 끌리는 카드를 선택하세요</h1><p id="instruction" aria-live="polite">카드를 섞을 때마다 새로운 무늬의 덱을 만납니다.</p></section><section class="stage" id="stage" aria-label="타로 카드 애니메이션"><div class="aura"></div><div class="cards" id="cards"></div></section><section class="controls"><div class="status"><span class="status-dot"></span><span id="status" role="status">준비 완료</span><span id="backName"></span></div><div class="actions"><button id="shuffleBtn" class="primary">카드 섞기</button><button id="resetBtn" class="secondary" hidden>다시 시작</button></div><p class="note">셔플할 때 덱 전체의 뒷면 무늬가 바뀝니다. 카드를 고르면 앞면이 공개됩니다.</p></section></main><script type="module" src="./js/main.js"></script></body></html>
